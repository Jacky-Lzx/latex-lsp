[package]
name = "latex-lsp"
version = "0.1.0"
edition = "2021"
description = "A lightweight LaTeX language server"
license = "MIT"

[dependencies]
icu_casemap = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
lsp-types = "0.94.1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true

[profile.release]
lto = "thin"
strip = true
