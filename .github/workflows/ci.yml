name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Replay an editing session over stdio
        run: python3 benchmarks/editing.py --scales small --iterations 2 --warmup 1 --runs 1 --output target/benchmarks/smoke.json
      - name: Replay an editing session with kernel hooks
        run: python3 benchmarks/editing.py --hooks --scales small --iterations 2 --warmup 1 --runs 1 --output target/benchmarks/hooks-smoke.json
