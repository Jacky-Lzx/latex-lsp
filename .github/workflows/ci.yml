name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 scripts/prepare-release.py --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Replay an editing session over stdio
        run: python3 benchmarks/editing.py --scales small --iterations 2 --warmup 1 --runs 1 --output target/benchmarks/smoke.json
      - name: Replay an editing session with kernel hook command and environment wrappers
        run: python3 benchmarks/editing.py --hook-renames --hook-wrappers --hook-environments --hook-interfaces --scales small --iterations 2 --warmup 1 --runs 1 --output target/benchmarks/hooks-smoke.json
      - name: Validate the paired rename probe
        run: PYTHONDONTWRITEBYTECODE=1 python3 benchmarks/rename_pairs.py --before target/release/texquill --after target/release/texquill --hook-wrappers --hook-environments --hook-interfaces --scales small --iterations 2 --warmup 1 --runs 1 --output target/benchmarks/pairs-smoke.json
      - name: Validate the paired definition probe
        run: PYTHONDONTWRITEBYTECODE=1 python3 benchmarks/rename_pairs.py --before target/release/texquill --after target/release/texquill --query definition --hook-wrappers --hook-environments --hook-interfaces --scales small --iterations 2 --warmup 1 --runs 1 --output target/benchmarks/definition-pairs-smoke.json
      - name: Validate the paired custom hook rename probe
        run: PYTHONDONTWRITEBYTECODE=1 python3 benchmarks/rename_pairs.py --before target/release/texquill --after target/release/texquill --query hook-rename --hook-wrappers --hook-environments --hook-interfaces --scales small --iterations 2 --warmup 1 --runs 1 --output target/benchmarks/hook-rename-pairs-smoke.json
