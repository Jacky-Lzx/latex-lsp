name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish crates.io and GitHub Release (requires a matching v* tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check release versions and tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            python3 scripts/prepare-release.py --check --tag "$RELEASE_REF_NAME"
          elif [ "$PUBLISH" = true ]; then
            echo 'Publication requires a vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          else
            python3 scripts/prepare-release.py --check
          fi
      - name: Use canonical temporary paths on macOS
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 scripts/smoke-lsp.py target/release/texquill --version "$(cargo metadata --no-deps --format-version=1 --locked --offline | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "texquill"))')"

  nix:
    uses: ./.github/workflows/nix.yml

  package:
    needs: [check, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/prepare-release.py
      - run: cargo publish --dry-run --locked
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: target/release-assets/*
          if-no-files-found: error

  homebrew:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: target/release-assets
      - name: Test the generated Formula against the verified local archive
        run: |
          brew tap-new --no-git texquill/release-test
          tap="$(brew --repository texquill/release-test)"
          cp target/release-assets/texquill.rb "$tap/Formula/texquill.rb"
          python3 - "$tap/Formula/texquill.rb" <<'PY'
          from pathlib import Path
          import re
          import sys
          formula = Path(sys.argv[1])
          archive = next(Path('target/release-assets').resolve().glob('*.tar.gz'))
          formula.write_text(re.sub(r'  url ".*"', f'  url "{archive.as_uri()}"', formula.read_text()))
          PY
          brew install --build-from-source texquill/release-test/texquill
          brew test texquill/release-test/texquill

  publish:
    needs: [package, homebrew]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: target/release-assets
      - name: Verify the release tag and artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/prepare-release.py --check --tag "$RELEASE_TAG"
          cd target/release-assets
          sha256sum --check SHA256SUMS
      - name: Authenticate using crates.io Trusted Publishing
        if: env.CARGO_REGISTRY_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Create GitHub Release and attach source, Formula, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" target/release-assets/* --verify-tag --title "TeXquill $RELEASE_TAG" --generate-notes
