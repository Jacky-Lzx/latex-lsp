name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub Release (requires a matching v* tag)'
        type: boolean
        default: false
      publish_crate:
        description: 'Publish to crates.io independently (requires a matching v* tag and credentials)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check release versions and tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish || inputs.publish_crate }}
        run: |
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            python3 scripts/prepare-release.py --check --tag "$RELEASE_REF_NAME"
          elif [ "$PUBLISH" = true ]; then
            echo 'Publication requires a vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          else
            python3 scripts/prepare-release.py --check
          fi
      - name: Use canonical temporary paths on macOS
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 scripts/smoke-lsp.py target/release/texquill --version "$(cargo metadata --no-deps --format-version=1 --locked --offline | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "texquill"))')"

  nix:
    uses: ./.github/workflows/nix.yml

  package:
    needs: [check, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/prepare-release.py
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: target/release-assets/*
          if-no-files-found: error

  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Include the MSVC runtime so the Windows binary needs no separate VC runtime install.
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Use canonical temporary paths on macOS
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - name: Build native release binary
        env:
          BINARY_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$BINARY_TARGET"
      - name: Package and test the extracted executable
        env:
          BINARY_TARGET: ${{ matrix.target }}
        run: python scripts/prepare-release.py --binary-target "$BINARY_TARGET" --output-dir target/binary-assets
      - uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.target }}
          path: target/binary-assets/*
          if-no-files-found: error

  homebrew:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: target/release-assets
      - name: Test the generated Formula against the verified local archive
        run: |
          brew tap-new --no-git texquill/release-test
          tap="$(brew --repository texquill/release-test)"
          cp target/release-assets/texquill.rb "$tap/Formula/texquill.rb"
          python3 - "$tap/Formula/texquill.rb" <<'PY'
          from pathlib import Path
          import re
          import sys
          formula = Path(sys.argv[1])
          archive = next(Path('target/release-assets').resolve().glob('*.tar.gz'))
          formula.write_text(re.sub(r'  url ".*"', f'  url "{archive.as_uri()}"', formula.read_text()))
          PY
          brew install --build-from-source texquill/release-test/texquill
          brew test texquill/release-test/texquill

  assemble:
    needs: [package, homebrew, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: target/release-assets
      - uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          merge-multiple: true
          path: target/release-assets
      - name: Verify and combine source and binary checksums
        run: |
          cd target/release-assets
          sha256sum --check SHA256SUMS
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
            cat "$checksum" >> SHA256SUMS
            rm "$checksum"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: github-release-assets
          path: target/release-assets/*
          if-no-files-found: error

  publish-github:
    needs: assemble
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: github-release-assets
          path: target/release-assets
      - name: Verify all release assets
        run: cd target/release-assets && sha256sum --check SHA256SUMS
      - name: Create GitHub Release with all verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" target/release-assets/* --verify-tag --title "TeXquill $RELEASE_TAG" --generate-notes

  publish-crate:
    needs: [package, homebrew]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: target/release-assets
      - name: Verify the release tag and artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/prepare-release.py --check --tag "$RELEASE_TAG"
          cd target/release-assets
          sha256sum --check SHA256SUMS
      - name: Authenticate using crates.io Trusted Publishing
        if: env.CARGO_REGISTRY_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
